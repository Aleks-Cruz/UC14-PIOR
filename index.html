<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>ClimApp</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENU -->
    <aside class="sidebar">

        <h2 onclick="voltarHome()">
    🌎 ClimApp
</h2>

        <button onclick="trocarPais('brasil')">Brasil</button>

        <button onclick="trocarPais('argentina')">Argentina</button>

        <button onclick="trocarPais('australia')">Austrália</button>

        <button onclick="trocarPais('canada')">Canadá</button>

        <button onclick="trocarPais('eua')">EUA</button>

        <button onclick="trocarPais('peru')">Peru</button>

    </aside>

            <img
            src="IMG/brasil.svg"

                coords="289,1309,826,852,699,1443,543,1409,430,1354,430,1353,433,1354"

    <button onclick="fazerLogin()">
